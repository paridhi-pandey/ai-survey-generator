# Rename this to secrets.toml and fill in your values
# Place it at .streamlit/secrets.toml

[gemini]
api_key = "YOUR_GEMINI_API_KEY_HERE"

[google_oauth]
client_id = "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
client_secret = "YOUR_GOOGLE_CLIENT_SECRET"
redirect_uri = "http://localhost:8501/component/streamlit_oauth.authorize_button"

[cookie]
secret = "SOME_LONG_RANDOM_SECRET_STRING_FOR_COOKIE_SIGNING"
